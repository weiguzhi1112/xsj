function pnCall(c){closeApp(true);openApp('chat');setTimeout(()=>callOpen(c.id,'out'),450)}
function pnDo(a,d){const c=WX.cons.find(x=>x.id==d.id)||WX.cons.find(x=>x.id==PH.id);
 if(a=='tab'){PH.tab=+d.t;PH.v='l';pnRender()}
 else if(a=='key'){if(PH.num.length<20){PH.num+=d.k;pnRender()}}
 else if(a=='del'){PH.num=PH.num.slice(0,-1);pnRender()}
 else if(a=='dial'){if(!PH.num)return;const m=pnFind(PH.num);if(m){PH.num='';pnCall(m)}else{pnLog(null,'out',0,PH.num);gtoast('该号码暂时无人接听');PH.num='';pnRender()}}
 else if(a=='save'){PH.d={ph:PH.num};PH.edit=0;PH.v='a';pnRender()}
 else if(a=='redial'){const x=PH.log[+d.i];if(!x)return;const m=x.id&&WX.cons.find(c=>c.id==x.id);if(m)pnCall(m);else{PH.tab=2;PH.num=x.ph||'';PH.v='l';pnRender()}}
 else if(a=='clr')confirmSheet('清空全部通话记录？','清空',()=>{PH.log=[];pnSave();pnRender()});
 else if(a=='new'){PH.d={};PH.edit=0;PH.v='a';pnRender()}
 else if(a=='edit'&&c){PH.d={name:c.name,ph:c.ph,remark:c.remark,persona:c.persona};PH.edit=c.id;PH.v='a';pnRender()}
 else if(a=='open'){PH.id=+d.id;PH.v='d';pnRender()}
 else if(a=='back'){PH.v=PH.edit?'d':'l';PH.edit=0;pnRender()}
 else if(a=='saveC'){const name=($('#pn_nm').value||'').trim();if(!name)return gtoast('请输入昵称');const f={name,remark:($('#pn_rm').value||'').trim(),ph:($('#pn_ph').value||'').trim(),persona:($('#pn_ps').value||'').trim()};if(PH.edit){const t=WX.cons.find(x=>x.id==PH.edit);if(t)Object.assign(t,f);wsave();PH.v='d';PH.id=PH.edit;PH.edit=0;pnRender();gtoast('已保存');return}const nid=Date.now();WX.cons.push({id:nid,wid:'wxid_'+nid.toString(36),...f,grp:'我的好友',av:''});wsave();PH.v='l';if(PH.mode=='phone')PH.tab=1;pnRender();gtoast('已添加联系人')}
 else if(a=='del2'&&c)confirmSheet('删除联系人「'+nm(c)+'」？','删除',()=>{WX.cons=WX.cons.filter(x=>x.id!=c.id);delete WX.msgs[c.id];delete WX.msgs['o'+c.id];wsave();PH.v='l';pnRender()},'同时会删除与对方的微信聊天记录');
 else if(a=='call'&&c)pnCall(c);
 else if(a=='wx'&&c){closeApp(true);openApp('chat');setTimeout(()=>rChat(c.id),450)}
 else if(a=='sms'&&c){const k=c.ph||nm(c);closeApp(true);openApp('sms');setTimeout(()=>{SMS.t[k]??=[];if(!SMS.o.includes(k))SMS.o.unshift(k);SO.k=k;SO.v='t';rSms()},450)}}

function previewSheet(title,text,sub){SHs.items=[{t:'复制',f:()=>copy(text)}];shOpen(title,sub||'',`<pre class="pv">${esc(text)}</pre><div class="l"><button class="si" data-sk="0"><span>复制全部</span></button><button class="si" data-sk="x"><span>关闭</span></button></div>`)}
function promptPreview(c,kind){const sample=!c||!c.id;c=c||{id:0,name:'示例角色',persona:'性格随和的普通朋友'};
 let sys,hist;
 if(kind=='sms'){sys=smsSys(c);hist=sample?[{role:'user',content:'在吗？今晚想吃点什么'}]:smsHist(smsThread(c),c)}
 else if(kind=='call'){sys=callSys(c,'out');hist=sample?[{role:'user',content:'（电话接通了）'}]:wxHist(c)}
 else{sys=wxSys(c);hist=sample?[{role:'user',content:'在吗？今晚想吃点什么'}]:wxHist(c)}
 const W=wbApply(sample?null:c.id,hist,sys),h=W.hist,last=h.slice(-6);
 return '【System 提示词】\n'+W.sys+'\n\n【对话历史】共 '+h.length+' 条'+(h.length>6?'，以下是最后 6 条':'')+'\n'+(last.length?last.map(x=>'['+x.role+'] '+x.content).join('\n'):'（还没有对话）')+'\n\n※ 世界书里设有触发概率的条目，每次发送时命中情况可能不同。'+(sample?'\n※ 这是示例角色的预览，选择具体联系人可以看到真实内容。':'')}

 h+=`<div class="card"><h3>导入方式</h3><div class="seg" style="margin:12px 0 0"><button data-dx="mode" data-m="overwrite"${I.mode=='overwrite'?' class="on"':''}>覆盖</button><button data-dx="mode" data-m="merge"${I.mode=='merge'?' class="on"':''}>合并</button></div><p class="stt">${I.mode=='overwrite'?'用文件内容替换本地对应类别，本地该类别原有的数据会被清除。':'保留本地数据并追加文件内容：好友按标识去重，聊天与短信按内容和时间追加，号码按号码去重，备忘录按编号去重并保留较新的，相册按内容去重；接口、外观、桌面布局等配置类以文件内容为准。'}</p></div>`;
 h+=`<div class="card"><h3>选择要导入的类别</h3>${ids.map(id=>{const c=cat(id),bad=I.bad[id],fs=bad?0:JSON.stringify(d.cats[id]).length;return`<label class="xr${bad?' off':''}"><input type="checkbox" data-ic="${id}"${I.sel[id]&&!bad?' checked':''}${bad?' disabled':''}><i class="bx"></i><span class="nm">${esc(c.name)}<small${bad?' style="color:var(--danger)"':''}>${bad?esc(bad):'本地现有 '+fmtB(catSize(c))}</small></span><em>${bad?'不可导入':fmtB(fs)}</em></label>`}).join('')}</div>`;
 const n=ids.filter(id=>I.sel[id]&&!I.bad[id]).length;
 h+=`<button class="pb" id="dm_go" data-dx="doimp"${n?'':' disabled'}>${d.schema>SCHEMA?'仍要导入':'开始导入'}</button><button class="pb ghost" data-dx="back">取消</button>`;return h}
function updIT(){const b=document.getElementById('dm_go');if(b&&IM)b.disabled=!Object.keys(IM.sel).some(id=>IM.sel[id]&&IM.data.cats[id]&&!IM.bad[id])}
function selIds(){const I=IM;return Object.keys(I.sel).filter(id=>I.sel[id]&&I.data.cats[id]&&!I.bad[id]&&(!I.only||I.only==id))}
function confirmImport(){const I=IM,ids=selIds();if(!ids.length)return;const ow=I.mode=='overwrite';
 const lines=ids.map(id=>'· '+cat(id).name+'：'+cat(id).affects).join('\n');
 actSheet(ow?'确认覆盖导入':'确认合并导入',[{t:ow?'覆盖导入':'合并导入',dg:ow,f:applyImport}],(ow?'将用文件内容覆盖以下本地数据，原有内容会被清除：\n':'将把文件内容合并进以下本地数据，现有内容会保留：\n')+lines+'\n\n建议先「导出全部」备份当前数据。'+(I.data.schema>SCHEMA?'\n\n注意：备份文件版本较新，可能不兼容。':''))}
function applyImport(){const I=IM;if(!I)return;const ids=selIds(),ok=[],fail=[],notes=[];GEN++;
 for(const id of ids){const c=cat(id),inc=I.data.cats[id];c._note='';let next;
  try{next=I.mode=='merge'?(c.merge?c.merge(readCat(c),inc):Object.assign({},readCat(c),inc)):inc}catch(e){fail.push(c.name+'（数据处理出错）');continue}
  const prev={},wrote=[];c.keys().forEach(k=>{prev[k]=LS.get(k)});
  try{if(I.mode!='merge')c.keys().forEach(k=>{if(!(k in next))LS.del(k)});for(const k in next){if(!c.allow(k))continue;LS.set(k,JSON.stringify(next[k]));wrote.push(k)}ok.push(c.name);if(c._note)notes.push(c._note)}
  catch(e){for(const k of Object.keys(prev)){try{prev[k]===null?LS.del(k):LS.set(k,prev[k])}catch(x){}}wrote.forEach(k=>{if(!(k in prev))LS.del(k)});fail.push(c.name+'（存储空间不足，已恢复原有数据）')}}
 ids.forEach(id=>{const c=cat(id);if(ok.includes(c.name)){try{c.hydrate()}catch(e){}}});
 ST.dv=I.only||'';IM=null;RG.sel=null;rSet();
 infoSheet(fail.length&&!ok.length?'导入失败':'导入完成',(ok.length?'已导入：'+ok.join('、')+'。\n界面已同步更新，无需刷新页面。':'')+(fail.length?'\n未能导入：'+fail.join('；')+'。':'')+(notes.length?'\n'+notes.join('\n'):''))}

// ----- clear -----
function confirmClear(id){const c=cat(id);if(!c)return;actSheet('清除「'+c.name+'」？',[{t:'清除',dg:1,f:()=>clearCat(id)}],'将永久删除：'+c.affects+'。\n清除后相关应用会立即回到初始状态，且无法恢复。建议先导出备份。')}
function clearCat(id){const c=cat(id);if(!c)return;GEN++;c.keys().forEach(k=>LS.del(k));try{c.hydrate()}catch(e){}if(ST.dv==id)ST.dv='';RG.sel=null;rSet();gtoast('已清除「'+c.name+'」')}
function confirmClearAll(){actSheet('清除全部数据？',[{t:'清除全部数据',dg:1,f:clearAll}],'将永久删除本应用保存的全部数据：接口配置、外观设置、壁纸与图标布局、微信账号与聊天、短信、营业厅号码、备忘录、相册，以及各应用的数据。\n清除后应用会回到初始状态，需要重新办理号码并注册微信。此操作无法恢复，建议先导出备份。')}
function clearAll(){GEN++;const ks=new Set();DATA.forEach(c=>c.keys().forEach(k=>ks.add(k)));ks.forEach(k=>LS.del(k));
 DATA.forEach(c=>{try{c.hydrate()}catch(e){}});N.length=0;rl();hideB();ST.dv='';IM=null;ST.msg={};ST.busy={};RG.sel=null;rSet();gtoast('已清除全部数据，应用已回到初始状态',3200)}

// ----- events -----
function manage(id){if(id=='misc'){const m=RGD&&RGD.ring.find(r=>r.id=='misc');if(!m)return;actSheet('其他',m.members.map(r=>({t:r.name+'　'+fmtB(r.size),f:()=>{ST.dv=r.id;rSet()}})),'这些类别各自占比很小，已合并显示。选择一项进入管理。');return}ST.dv=id;rSet()}
function dataClick(x){const d=x.dataset;switch(d.dx){
 case'sel':ringSelect(d.id);break;
 case'mg':manage(d.id);break;
 case'back':if(ST.dv=='import'&&IM&&IM.from){ST.dv=IM.from}else ST.dv='';IM=null;rSet();break;
 case'expsel':startExport(DATA.filter(c=>XS.sel[c.id]).map(c=>c.id),true);break;
 case'expall':startExport(DATA.map(c=>c.id),false);break;
 case'expcat':startExport([d.id],true);break;
 case'mode':if(IM){IM.mode=d.m;rSet(1)}break;
 case'doimp':confirmImport();break;
 case'clrcat':confirmClear(d.id);break;
 case'clrall':confirmClearAll();break}}
$('#st').addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('[data-dx]');if(x)dataClick(x);else{const s=e.target.closest&&e.target.closest('.sg');if(s)ringSelect(s.dataset.id)}});
$('#st').addEventListener('mouseover',e=>{const x=e.target.closest&&e.target.closest('.sg,.lgr');if(x&&x.dataset.id)ringPreview(x.dataset.id)});
$('#st').addEventListener('mouseout',e=>{const x=e.target.closest&&e.target.closest('.sg,.lgr');if(x)ringPreview(RG.sel)});
$('#st').addEventListener('focusin',e=>{const x=e.target.closest&&e.target.closest('.sg');if(x)ringPreview(x.dataset.id)});
$('#st').addEventListener('focusout',e=>{const x=e.target.closest&&e.target.closest('.sg');if(x)ringPreview(RG.sel)});
$('#st').addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
 if(d.dc){XS.sel[d.dc]=t.checked;updXT()}
 else if(d.ic&&IM){IM.sel[d.ic]=t.checked;updIT()}
 else if(t.id=='dm_imp'||t.id=='dm_impc'){const f=t.files&&t.files[0];t.value='';if(f)loadBackup(f,t.id=='dm_impc'?ST.dv:null)}});
DATA.forEach(c=>{try{c.hydrate()}catch(e){console.error(c.id,e)}});

applyDisp();
updBadges();
</script>
